name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Harness against Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both lines. 24 is the active LTS and is what the compatibility claim is about.
      # 26 is Current and is where the next set of surprises comes from.
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # The fixture suite is the control. It contains one test that must pass, one that must
      # fail, one that must be detected as skipped, and one that only passes if the
      # `// Flags:` directive was honoured. If any of those four move, the harness is wrong
      # rather than the runtime being wrong.
      - run: cargo test --all-targets
